name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check

  ci:
    name: Lint → Type-check → Test → Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voxcript
          POSTGRES_PASSWORD: voxcript
          POSTGRES_DB: voxcript
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxcript"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://voxcript:voxcript@localhost:5432/voxcript?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (shared and api)
        run: pnpm run build
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Type-check
        run: pnpm run typecheck
      - name: Migrate
        run: pnpm --filter @transcribe/api exec prisma migrate deploy
      - name: Test
        run: pnpm run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @transcribe/web exec playwright install chromium --with-deps
      - name: Build and start e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d --build
      - name: Wait for API ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/ready; then echo ready; break; fi
            echo "waiting $i"; sleep 2
          done
      - name: Wait for web ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080; then echo ready; break; fi
            echo "waiting $i"; sleep 2
          done
      - name: Run Playwright
        run: pnpm --filter @transcribe/web exec playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/web/test-results
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
